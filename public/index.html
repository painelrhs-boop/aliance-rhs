<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">
<meta name="description" content="ALIANCE R.H.S — grupos e canais em um só lugar">
<title>ALIANCE R.H.S</title>

<link rel="icon" href="/logo.svg">

<link rel="stylesheet" href="/css/global.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/animations.css">
<link rel="stylesheet" href="/css/responsive.css">

<style>

/* =========================================================
   ALIANCE R.H.S — NETWORK HOME
   ========================================================= */

:root{
  --black:#030303;
  --black2:#070707;
  --panel:#0a0b0c;
  --panel2:#0e1012;
  --panel3:#121416;
  --border:#202326;
  --border2:#292c30;

  --red:#e50914;
  --red2:#ff1824;
  --red3:#8c0008;

  --white:#f7f7f7;
  --text:#d7d7d7;
  --muted:#777;
  --muted2:#4c4c4c;

  --green:#18d96b;
  --yellow:#ffbd25;

  --radius:14px;
}

/* RESET */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--black);
  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

body,
button,
input{
  font-family:Arial,Helvetica,sans-serif;
}

button,
input{
  outline:none;
}

a{
  color:inherit;
  text-decoration:none;
}

img{
  max-width:100%;
}

button{
  cursor:pointer;
}

/* =========================================================
   MAIN APP
   ========================================================= */

.rhs-app{
  min-height:100vh;
  background:
    radial-gradient(
      circle at 50% -20%,
      rgba(229,9,20,.16),
      transparent 38%
    ),
    linear-gradient(
      180deg,
      #050505 0%,
      #030303 100%
    );
}

/* =========================================================
   HEADER
   ========================================================= */

.rhs-header{
  position:sticky;
  top:0;
  z-index:1000;

  height:74px;

  background:
    rgba(4,4,4,.92);

  border-bottom:1px solid #17191b;

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}

.rhs-header-inner{
  width:min(1280px,94%);
  height:100%;
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

/* BRAND */

.rhs-brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.rhs-brand-logo{
  width:42px;
  height:42px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:11px;

  border:1px solid rgba(229,9,20,.5);

  background:
    radial-gradient(
      circle,
      rgba(229,9,20,.12),
      transparent 65%
    ),
    #070707;

  box-shadow:
    0 0 25px rgba(229,9,20,.09);
}

.rhs-brand-logo img{
  width:29px;
  height:29px;
  object-fit:contain;
}

.rhs-brand-text{
  display:flex;
  flex-direction:column;
  line-height:1;
}

.rhs-brand-title{
  font-size:13px;
  font-weight:900;
  letter-spacing:.4px;
}

.rhs-brand-title span{
  color:var(--red);
}

.rhs-brand-sub{
  margin-top:5px;

  color:#555;

  font-size:7px;
  font-weight:800;

  letter-spacing:2px;
  text-transform:uppercase;
}

/* DESKTOP NAV */

.rhs-desktop-nav{
  display:flex;
  align-items:center;
  gap:7px;
}

.rhs-desktop-nav a{
  padding:10px 13px;

  border-radius:7px;

  color:#686868;

  font-size:8px;
  font-weight:900;

  letter-spacing:1px;
  text-transform:uppercase;

  transition:.2s;
}

.rhs-desktop-nav a:hover,
.rhs-desktop-nav a.active{
  color:#fff;
  background:#111315;
}

.rhs-desktop-nav a.active{
  box-shadow:
    inset 0 -2px 0 var(--red);
}

/* HEADER ACTION */

.rhs-header-admin{
  display:flex;
  align-items:center;
  gap:9px;
}

.rhs-admin-button{
  display:flex;
  align-items:center;
  gap:7px;

  padding:10px 13px;

  border:1px solid #292c30;
  border-radius:8px;

  background:#0b0c0d;

  color:#aaa;

  font-size:8px;
  font-weight:900;

  letter-spacing:1px;
  text-transform:uppercase;

  transition:.2s;
}

.rhs-admin-button:hover{
  color:#fff;
  border-color:#444;
}

/* =========================================================
   HERO
   ========================================================= */

.rhs-hero{
  position:relative;

  min-height:610px;

  overflow:hidden;

  border-bottom:1px solid #121416;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;
}

/* BACKGROUND */

.rhs-hero-bg{
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.25),
      #030303 92%
    ),
    radial-gradient(
      circle at 50% 20%,
      rgba(229,9,20,.18),
      transparent 32%
    );
}

.rhs-hero-grid{
  position:absolute;
  inset:0;

  opacity:.11;

  background-image:
    linear-gradient(
      rgba(255,255,255,.05) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.05) 1px,
      transparent 1px
    );

  background-size:60px 60px;

  mask-image:
    linear-gradient(
      to bottom,
      #000,
      transparent 88%
    );
}

.rhs-hero-red{
  position:absolute;

  width:550px;
  height:550px;

  left:50%;
  top:-350px;

  transform:translateX(-50%);

  border-radius:50%;

  background:rgba(229,9,20,.12);

  filter:blur(90px);
}

/* SIDE LINES */

.rhs-side-line{
  position:absolute;

  top:80px;

  width:1px;
  height:350px;

  background:
    linear-gradient(
      transparent,
      rgba(229,9,20,.55),
      transparent
    );
}

.rhs-side-line.left{
  left:7%;
}

.rhs-side-line.right{
  right:7%;
}

/* HERO CONTENT */

.rhs-hero-content{
  position:relative;
  z-index:5;

  width:min(900px,92%);

  padding:100px 0 70px;
}

/* OFFICIAL */

.rhs-official{
  display:inline-flex;
  align-items:center;
  gap:7px;

  padding:7px 11px;

  border:1px solid rgba(229,9,20,.35);
  border-radius:20px;

  background:rgba(229,9,20,.07);

  color:#e8e8e8;

  font-size:7px;
  font-weight:900;

  letter-spacing:2px;
  text-transform:uppercase;
}

.rhs-official-dot{
  width:6px;
  height:6px;

  border-radius:50%;

  background:var(--red);

  box-shadow:
    0 0 10px var(--red);
}

/* HERO LOGO */

.rhs-hero-logo{
  width:125px;
  height:125px;

  margin:25px auto 20px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:35px;

  border:1px solid rgba(229,9,20,.5);

  background:
    radial-gradient(
      circle,
      rgba(229,9,20,.18),
      transparent 68%
    ),
    #070707;

  box-shadow:
    0 0 50px rgba(229,9,20,.12),
    inset 0 0 35px rgba(229,9,20,.05);

  transform:rotate(-1deg);
}

.rhs-hero-logo img{
  width:92px;
  height:92px;

  object-fit:contain;

  filter:
    drop-shadow(
      0 0 18px
      rgba(229,9,20,.25)
    );
}

/* TITLE */

.rhs-hero-title{
  margin:0;

  font-size:
    clamp(
      48px,
      10vw,
      105px
    );

  line-height:.82;

  font-weight:950;

  letter-spacing:-7px;

  text-transform:uppercase;
}

.rhs-hero-title .light{
  color:#eee;
}

.rhs-hero-title .red{
  color:var(--red);
}

/* SUBTITLE */

.rhs-hero-description{
  width:min(570px,90%);

  margin:24px auto 0;

  color:#777;

  font-size:11px;

  line-height:1.8;
}

.rhs-hero-description strong{
  color:#bbb;
}

/* HERO BUTTONS */

.rhs-hero-buttons{
  display:flex;
  justify-content:center;
  gap:8px;

  margin-top:28px;

  flex-wrap:wrap;
}

.rhs-hero-btn{
  min-width:150px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;

  padding:13px 18px;

  border-radius:8px;

  font-size:8px;
  font-weight:900;

  letter-spacing:1px;
  text-transform:uppercase;

  transition:.22s;
}

.rhs-hero-btn.primary{
  background:var(--red);

  color:#fff;

  box-shadow:
    0 12px 35px
    rgba(229,9,20,.2);
}

.rhs-hero-btn.primary:hover{
  background:var(--red2);
  transform:translateY(-2px);
}

.rhs-hero-btn.secondary{
  border:1px solid #292c30;

  background:#0a0b0c;

  color:#aaa;
}

.rhs-hero-btn.secondary:hover{
  color:#fff;
  border-color:#4a4d50;
}

/* =========================================================
   QUICK INFO
   ========================================================= */

.rhs-quick{
  width:min(1120px,92%);

  margin:-34px auto 0;

  position:relative;
  z-index:10;
