<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>R.H.S — Administração</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --red:#e50914;
  --red2:#ff2633;
  --bg:#050505;
  --panel:#0b0b0b;
  --panel2:#101010;
  --border:#1d1d1d;
  --text:#fff;
  --muted:#777;
  --green:#18d878;
  --yellow:#f5bd3f;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 80% 0%,rgba(229,9,20,.10),transparent 28%),
    #050505;
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* LOGIN */

#admin-login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:min(430px,100%);
  background:linear-gradient(145deg,#101010,#080808);
  border:1px solid #222;
  border-radius:20px;
  padding:35px;
  box-shadow:0 30px 100px rgba(0,0,0,.55);
}

.login-brand{
  text-align:center;
  margin-bottom:30px;
}

.login-brand strong{
  display:block;
  font-size:25px;
  font-weight:950;
  letter-spacing:-1px;
}

.login-brand strong span{
  color:var(--red);
}

.login-brand small{
  display:block;
  color:#666;
  margin-top:8px;
  font-size:10px;
  letter-spacing:3px;
}

.field{
  margin-bottom:16px;
}

.field label{
  display:block;
  color:#aaa;
  font-size:10px;
  font-weight:800;
  margin-bottom:8px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid #242424;
  background:#070707;
  color:#fff;
  outline:none;
  border-radius:10px;
  padding:13px;
}

.field textarea{
  resize:vertical;
  min-height:100px;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:var(--red);
  box-shadow:0 0 0 3px rgba(229,9,20,.08);
}

.primary-btn{
  border:0;
  width:100%;
  padding:14px;
  border-radius:10px;
  color:#fff;
  background:var(--red);
  font-size:11px;
  font-weight:900;
  transition:.2s;
}

.primary-btn:hover{
  background:var(--red2);
  transform:translateY(-1px);
}

.error{
  color:#ff5d68;
  font-size:11px;
  margin-top:12px;
  text-align:center;
}

/* APP */

#admin-panel{
  min-height:100vh;
  display:flex;
}

/* SIDEBAR */

.sidebar{
  width:245px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  border-right:1px solid var(--border);
  background:#070707;
  padding:22px 14px;
  z-index:20;
}

.brand{
  padding:8px 12px 25px;
  border-bottom:1px solid #181818;
  margin-bottom:18px;
}

.brand b{
  font-size:18px;
  letter-spacing:-.5px;
}

.brand b span{
  color:var(--red);
}

.brand small{
  display:block;
  color:#555;
  font-size:8px;
  letter-spacing:2px;
  margin-top:6px;
}

.nav-title{
  color:#444;
  font-size:8px;
  font-weight:900;
  letter-spacing:2px;
  padding:10px 12px;
}

.side-btn{
  width:100%;
  border:1px solid transparent;
  background:transparent;
  color:#777;
  padding:12px;
  text-align:left;
  border-radius:9px;
  font-size:10px;
  font-weight:800;
  margin-bottom:4px;
  transition:.2s;
}

.side-btn:hover,
.side-btn.active{
  color:#fff;
  background:#111;
  border-color:#202020;
}

.side-btn.active{
  box-shadow:inset 2px 0 0 var(--red);
}

.user-box{
  position:absolute;
  bottom:15px;
  left:14px;
  right:14px;
  padding:12px;
  border:1px solid #1b1b1b;
  border-radius:10px;
  background:#0b0b0b;
}

.user-box strong{
  display:block;
  font-size:10px;
}

.user-box small{
  color:#555;
  font-size:8px;
  word-break:break-all;
}

.logout{
  width:100%;
  margin-top:10px;
  border:1px solid #292929;
  background:#101010;
  color:#aaa;
  border-radius:7px;
  padding:8px;
  font-size:9px;
  font-weight:800;
}

/* CONTENT */

.main{
  width:calc(100% - 245px);
  margin-left:245px;
  padding:28px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:28px;
}

.page-title h1{
  margin:0;
  font-size:27px;
  letter-spacing:-1px;
}

.page-title p{
  margin:6px 0 0;
  color:#666;
  font-size:11px;
}

.status{
  display:flex;
  align-items:center;
  gap:8px;
  color:#777;
  font-size:9px;
}

.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 10px var(--green);
}

/* CARDS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:20px;
}

.stat{
  background:#0b0b0b;
  border:1px solid #1b1b1b;
  border-radius:12px;
  padding:18px;
}

.stat small{
  color:#555;
  font-size:8px;
  font-weight:900;
  letter-spacing:1px;
}

.stat strong{
  display:block;
  font-size:27px;
  margin-top:8px;
}

.stat span{
  color:var(--red);
  font-size:8px;
}

.panel{
  background:#0a0a0a;
  border:1px solid #1b1b1b;
  border-radius:14px;
  padding:20px;
  margin-bottom:18px;
}

.panel-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.panel-head h2{
  margin:0;
  font-size:16px;
}

.panel-head p{
  margin:5px 0 0;
  color:#555;
  font-size:9px;
}
