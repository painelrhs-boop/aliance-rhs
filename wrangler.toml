name = "aliance-rhs"
main = "src/worker.js"
compatibility_date = "2026-09-09"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Para produção, crie estas variáveis/secretos com `wrangler secret put`.
# ADMIN1_EMAIL, ADMIN1_PASSWORD, ADMIN2_EMAIL, ADMIN2_PASSWORD
# ADMIN_SESSION_SECRET também deve ser um segredo forte e aleatório.
