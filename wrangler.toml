name = "aliance-rhs"
main = "worker.js"
compatibility_date = "2026-09-09"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"

[assets.exclude]
paths = [
  "node_modules/**",
  ".git/**",
  "*.zip",
  "wrangler.toml",
  "package.json",
  "bun.lock",
  "package-lock.json"
]
